<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0a0c14;
      --surface: #111420;
      --card: #161926;
      --border: #1e2338;
      --text: #dde3f0;
      --muted: #6b7591;
      --dim: #3a4260;
      --k-accent: #f97316;
      --k-bg: #1a1008;
      --k-border: #f97316;
      --y-accent: #22d3ee;
      --y-bg: #041418;
      --y-border: #22d3ee;
      --nonveg-col: #f97316;
      --rajma-col: #ef4444;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --card: #eef1f8;
        --border: #d0d6e8;
        --text: #1a1f36;
        --muted: #6b7591;
        --dim: #9aa3c0;
        --k-bg: #fff4ec;
        --k-border: #f97316;
        --y-bg: #e8fafd;
        --y-border: #22d3ee;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* ── Header ── */
    .page-title {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── Date Wheel ── */
    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 32px;
      user-select: none;
    }

    .wheel-nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .wheel-track {
      position: relative;
      height: 120px;
      width: 220px;
      overflow: hidden;
      cursor: ns-resize;
      touch-action: none;
      overscroll-behavior: contain;
    }

    .wheel-track::before,
    .wheel-track::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 36px;
      z-index: 2;
      pointer-events: none;
    }

    .wheel-track::before {
      top: 0;
      background: linear-gradient(to bottom, var(--bg), transparent);
    }

    .wheel-track::after {
      bottom: 0;
      background: linear-gradient(to top, var(--bg), transparent);
    }

    .wheel-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.18s cubic-bezier(.4, 0, .2, 1);
    }

    .wheel-item {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--dim);
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .wheel-item.active {
      font-size: 2.8rem;
      color: var(--text);
      height: 60px;
    }

    .wheel-item.near {
      color: var(--muted);
      font-size: 1.4rem;
    }

    .wheel-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid color-mix(in oklab, var(--border) 70%, var(--text));
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.18s ease;
    }

    .wheel-btn:hover {
      border-color: color-mix(in oklab, var(--text) 28%, var(--border));
    }

    .wheel-btn:active {
      border-color: color-mix(in oklab, var(--text) 28%, var(--border));
    }

    .date-label {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .week-badge {
      margin-top: 4px;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ── Meals ── */
    .meals {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .meal-block {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
    }

    .meal-label {
      padding: 9px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      font-weight: 600;
    }

    .cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* ── Individual mess card ── */
    .mess-card {
      padding: 16px 18px 16px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
      border: 2px solid transparent;
      border-radius: 0;
    }

    .mess-card:first-child {
      border-right: 1px solid var(--border);
    }

    .mess-card:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .mess-card.sel-k {
      background: var(--k-bg) !important;
      border: 2px solid var(--k-border);
      border-radius: 2px;
    }

    .mess-card.sel-y {
      background: var(--y-bg) !important;
      border: 2px solid var(--y-border);
      border-radius: 2px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .mess-name {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nvdot {
      width: 7px;
      height: 7px;
      background: var(--nonveg-col);
      border-radius: 50%;
      display: inline-block;
    }

    .tick {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .sel-k .tick {
      opacity: 1;
      background: var(--k-accent);
      color: #000;
    }

    .sel-y .tick {
      opacity: 1;
      background: var(--y-accent);
      color: #000;
    }

    .hero-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .sel-k .hero-name {
      color: var(--k-accent);
    }

    .sel-y .hero-name {
      color: var(--y-accent);
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-row {
      display: flex;
      gap: 7px;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .item-cat {
      font-size: 0.62rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 48px;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .item-name {
      color: #8a96b4;
    }

    .item-row.nv .item-name {
      color: var(--nonveg-col);
      font-weight: 600;
    }

    .item-row.rj .item-name {
      color: var(--rajma-col);
    }

    .rajma-warn {
      margin-top: 7px;
      font-size: 0.68rem;
      color: var(--rajma-col);
      opacity: 0.8;
    }

    /* ── Summary ── */
    .summary {
      max-width: 860px;
      margin: 20px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .sum-title {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
    }

    .sum-rows {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .sum-row {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.8rem;
    }

    .sum-meal {

      color: var(--dim);
    }

    .sum-choice {
      font-weight: 600;
    }

    .sum-choice.k {
      color: var(--k-accent);
    }

    .sum-choice.y {
      color: var(--y-accent);
    }

    .sum-choice.none {
      color: var(--dim);
    }

    @media (max-width: 560px) {
      .wheel-nav {
        gap: 10px;
      }

      .wheel-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }

      .hero-name {
        font-size: 0.9rem;
      }

      .item-row {
        font-size: 0.72rem;
      }
    }
  </style>
</head>

    // ─────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────
    function getWeek(date) {
      const dow = new Date(2026, 5, date).getDay();
      const sun = date - (dow === 0 ? 0 : dow);
      if (sun <= 0 || sun === 14 || sun === 28) return 'A';
      return 'B';
    }
    function getDayKey(date) { return DAYS[new Date(2026, 5, date).getDay()]; }
    function getFullLabel(date) {
      const d = new Date(2026, 5, date);
      return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()] + ', Jun ' + date;
    }
    function yuktaharFor(date) {
      return getWeek(date) === 'A' ? YA[getDayKey(date)] : YB[getDayKey(date)];
    }
    function kadambaFor(date) { return K[getDayKey(date)]; }

    // ─────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────
    let cur = 4;
    const picks = {}; // "date-meal" -> "k"|"y"

    // ─────────────────────────────────────────────
    // WHEEL
    // ─────────────────────────────────────────────
    const wheelInner = document.getElementById('wheelInner');
    const dateLabel = document.getElementById('dateLabel');

    function buildWheel() {
      wheelInner.innerHTML = '';
      for (let d = 0; d <= 31; d++) {
        const el = document.createElement('div');
        el.className = 'wheel-item';
        el.dataset.d = d;
        el.textContent = d === 0 || d === 31 ? '' : d;
        wheelInner.appendChild(el);
      }
    }

    function positionWheel(date, animate) {
      if (!animate) wheelInner.style.transition = 'none';
      const idx = date; // item index = date (0-indexed list has blank at 0)
      // center the active item: each item is 40px, active is 60px
      // offset: track height=120, center=60. Item 0..date-1 are 40px each, active=60px center
      const offset = 60 - (idx * 40 + 20); // 20 = half of 40
      wheelInner.style.transform = `translateY(${offset}px)`;
      setTimeout(() => { wheelInner.style.transition = ''; }, 10);

      wheelInner.querySelectorAll('.wheel-item').forEach(el => {
        const d = parseInt(el.dataset.d);
        el.className = 'wheel-item';
        if (d === date) el.classList.add('active');
        else if (Math.abs(d - date) === 1) el.classList.add('near');
      });
    }

    function hapticTick() {
      // Lightweight haptic pulse where supported (mostly mobile browsers).
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function setDate(d, opts = {}) {
      if (d < 1 || d > 30) return;
      cur = d;
      positionWheel(d, true);
      dateLabel.textContent = getFullLabel(d);
      renderMeals();
      renderSummary();
      if (opts.haptic) hapticTick();
    }

    buildWheel();
    const today = new Date();
    const defaultDay = (today.getFullYear() === 2026 && today.getMonth() === 5)
      ? Math.min(30, Math.max(1, today.getDate()))
      : 1;
    setDate(defaultDay);

    document.getElementById('prevBtn').onclick = () => setDate(cur - 1, { haptic: true });
    document.getElementById('nextBtn').onclick = () => setDate(cur + 1, { haptic: true });

    // Drag / swipe on wheel
    let dragStartY = null, dragStartDate = null;
    const wt = document.getElementById('wheelTrack');
    wt.addEventListener('mousedown', e => { dragStartY = e.clientY; dragStartDate = cur; });
    window.addEventListener('mousemove', e => {
      if (dragStartY === null) return;
      const delta = Math.round((dragStartY - e.clientY) / 40);
      const nd = Math.min(30, Math.max(1, dragStartDate + delta));
      if (nd !== cur) setDate(nd, { haptic: true });
    });
    window.addEventListener('mouseup', () => { dragStartY = null; });
    wt.addEventListener('touchstart', e => {
      dragStartY = e.touches[0].clientY;
      dragStartDate = cur;
    }, { passive: true });
    wt.addEventListener('touchmove', e => {
      if (dragStartY === null) return;
      e.preventDefault();
      const delta = Math.round((dragStartY - e.touches[0].clientY) / 40);
      const nd = Math.min(30, Math.max(1, dragStartDate + delta));
      if (nd !== cur) setDate(nd, { haptic: true });
    }, { passive: false });
    wt.addEventListener('touchend', () => { dragStartY = null; });
    wt.addEventListener('wheel', e => {
      e.preventDefault();
      setDate(cur + (e.deltaY > 0 ? 1 : -1), { haptic: true });
    }, { passive: false });


    // ─────────────────────────────────────────────
    // RENDER MEALS
    // ─────────────────────────────────────────────
    function renderCard(meal, key, side) {
      const selKey = cur + '-' + key;
      const isSel = picks[selKey] === side;
      const cls = isSel ? (side === 'k' ? 'sel-k' : 'sel-y') : '';
      const hasNv = side === 'k' && !!meal.nv;
      const label = side === 'k' ? (hasNv ? 'Kadamba NonVeg' : 'Kadamba') : 'Yuktahar';
      const nvDot = hasNv ? '<span class="nvdot"></span>' : '';
      const hasRj = meal.rj || meal.items.some(i => i.rj);

      const itemsHtml = meal.items.map(i =>
        `<div class="item-row ${i.nv ? 'nv' : ''} ${i.rj ? 'rj' : ''}">
      <span class="item-cat">${i.c}</span>
      <span class="item-name">${i.n}</span>
    </div>`
      ).join('');

      return `
    <div class="mess-card ${cls}" onclick="pick('${selKey}','${side}')">
      <div class="card-top">
        <div class="mess-name">${nvDot}${label}</div>
        <div class="tick">✓</div>
      </div>
      <div class="hero-name">${meal.hero}</div>
      <div class="items-list">${itemsHtml}</div>
      ${hasRj ? '<div class="rajma-warn">⚠ Contains rajma</div>' : ''}
    </div>`;
    }

    function renderMeals() {
      const kDay = kadambaFor(cur);
      const yDay = yuktaharFor(cur);
      const meals = [
        { key: 'breakfast', label: 'Breakfast' },
        { key: 'lunch', label: 'Lunch' },
        { key: 'dinner', label: 'Dinner' }
      ];
      document.getElementById('meals').innerHTML = meals.map(m => `
    <div class="meal-block">
      <div class="meal-label">${m.label}</div>
      <div class="cards-row">
        ${renderCard(kDay[m.key], m.key, 'k')}
        ${renderCard(yDay[m.key], m.key, 'y')}
      </div>
    </div>`).join('');
    }

    function renderSummary() {
      const names = { k: 'Kadamba', y: 'Yuktahar' };
      document.getElementById('sumRows').innerHTML = ['breakfast', 'lunch', 'dinner'].map(m => {
        const sel = picks[cur + '-' + m];
        return `<div class="sum-row">
      <span class="sum-meal">${m[0].toUpperCase() + m.slice(1)}</span>
      <span class="sum-choice ${sel || 'none'}">${sel ? names[sel] : '—'}</span>
    </div>`;
      }).join('');
    }

    function pick(selKey, side) {
      picks[selKey] = picks[selKey] === side ? undefined : side;
      renderMeals();
      renderSummary();
    }
  </script>
